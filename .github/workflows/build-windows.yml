name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    name: Export FastWOken for Windows
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Windows executable
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/FastWOken.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FastWOken-Windows
          path: build/
          if-no-files-found: error
          retention-days: 14
