name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    name: Export FastWOken for Windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Windows executable
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/FastWOken.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FastWOken-Windows
          path: build/
          if-no-files-found: error
          retention-days: 14
