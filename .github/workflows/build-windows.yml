name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-windows:
    name: Export FastWOken for Windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and prepare CC0 forest photo assets
        shell: bash
        run: |
          mkdir -p assets
          if [ ! -f assets/forest_slope.jpg ] || [ ! -f assets/forest_leaves_02.jpg ]; then
            curl -L --fail --retry 3 "https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/forest_slope.jpg" -o /tmp/forest_slope_source.jpg
            curl -L --fail --retry 3 "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/forest_leaves_02/forest_leaves_02_diffuse_4k.jpg" -o /tmp/forest_leaves_source.jpg
            python -m pip install --quiet pillow
            python - <<'PY'
          from PIL import Image
          Image.open("/tmp/forest_slope_source.jpg").convert("RGB").resize((2048, 1024), Image.Resampling.LANCZOS).save("assets/forest_slope.jpg", "JPEG", quality=88, optimize=True)
          Image.open("/tmp/forest_leaves_source.jpg").convert("RGB").resize((1024, 1024), Image.Resampling.LANCZOS).save("assets/forest_leaves_02.jpg", "JPEG", quality=88, optimize=True)
          PY
          fi
          test -s assets/forest_slope.jpg
          test -s assets/forest_leaves_02.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/forest_slope.jpg assets/forest_leaves_02.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add CC0 photographic forest background and ground texture"
            git fetch origin main
            if git cat-file -e origin/main:assets/forest_slope.jpg 2>/dev/null && git cat-file -e origin/main:assets/forest_leaves_02.jpg 2>/dev/null; then
              git reset --hard origin/main
            else
              git rebase origin/main
              git push
            fi
          fi

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Windows executable
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/FastWOken.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FastWOken-Windows
          path: build/
          if-no-files-found: error
          retention-days: 14
