name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export FastWOken APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/FastWOken.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FastWOken-Android-APK
          path: build/FastWOken.apk
          if-no-files-found: error
          retention-days: 14
