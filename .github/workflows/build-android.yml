name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export FastWOken APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and prepare CC0 forest photo assets
        shell: bash
        run: |
          mkdir -p assets
          if [ ! -f assets/forest_slope.jpg ] || [ ! -f assets/forest_leaves_02.jpg ]; then
            curl -L --fail --retry 3 "https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/forest_slope.jpg" -o /tmp/forest_slope_source.jpg
            curl -L --fail --retry 3 "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/forest_leaves_02/forest_leaves_02_diffuse_4k.jpg" -o /tmp/forest_leaves_source.jpg
            python -m pip install --quiet pillow
            python - <<'PY'
          from PIL import Image
          Image.open("/tmp/forest_slope_source.jpg").convert("RGB").resize((2048, 1024), Image.Resampling.LANCZOS).save("assets/forest_slope.jpg", "JPEG", quality=88, optimize=True)
          Image.open("/tmp/forest_leaves_source.jpg").convert("RGB").resize((1024, 1024), Image.Resampling.LANCZOS).save("assets/forest_leaves_02.jpg", "JPEG", quality=88, optimize=True)
          PY
          fi
          test -s assets/forest_slope.jpg
          test -s assets/forest_leaves_02.jpg

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -v -keystore build/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project resources
        run: godot --headless --editor --path . --quit
 
      - name: Validate all level routes and crystal placements
        run: godot --headless --path . --script res://tests/validate_levels.gd

      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/FastWOken.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FastWOken-Android-APK
          path: build/FastWOken.apk
          if-no-files-found: error
          retention-days: 14
